<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App de Músicas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="player">
    <img src="https://picsum.photos/id/1019/400/400" class="capa">
    <h2 id="titulo">Acoustic Breeze</h2>
    <p id="artista">Bensound</p>
    <audio id="audio" src="https://www.bensound.com/bensound-music/bensound-acousticbreeze.mp3">
    <div class="botoes">
      <button id="anterior">⏮</button>
      <button id="play">▶</button>
      <button id="proximo">⏭</button>
    </div>
    <ul id="lista"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
